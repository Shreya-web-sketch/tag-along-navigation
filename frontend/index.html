<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    button {
      font-size: 1.5rem;
      padding: 1.25rem 2rem;
      border: none;
      border-radius: 1rem;
      background: #1a73e8;
      color: #fff;
      min-width: 16rem;
    }
    button:active { background: #1557b0; }
    #status { font-size: 1rem; color: #555; min-height: 1.5rem; }
  </style>
</head>
<body>
  <button id="speak">Where do you want to go?</button>
  <p id="status"></p>

  <script>
    const btn = document.getElementById("speak");
    const status = document.getElementById("status");

    btn.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        status.textContent = "Text-to-speech is not supported in this browser.";
        return;
      }
      // Cancel anything still speaking, then speak the sentence.
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance("Turn left in fifty meters, then walk straight.");
      utterance.lang = "en-IN";
      utterance.rate = 0.9;
      utterance.onstart = () => (status.textContent = "Speaking...");
      utterance.onend = () => (status.textContent = "Done.");
      utterance.onerror = (e) => (status.textContent = "Error: " + e.error);
      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
